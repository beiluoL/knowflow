/* Typography scale */
.kb-h1 {

  font-weight: 700;

  letter-spacing: -0.02em;

}

.kb-h2 {
  font-family: var(--font-sans);
  font-size: 22px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.01em;
  color: var(--kb-foreground);
}

.kb-h3 {
  font-family: var(--font-sans);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--kb-foreground);
}

.kb-h4 {
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.45;
  color: var(--kb-foreground);
}

.kb-body {
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--kb-card-foreground);
}

.kb-body-sm {
  font-family: var(--font-sans);

  font-weight: 400;

}

.kb-caption {

  font-size: 11px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--kb-muted-foreground);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

<body class="h-screen overflow-hidden flex flex-col" style="background:var(--kb-background);font-family:var(--font-sans);">

<!-- 精简顶部栏 -->
<div class="h-14 flex items-center justify-between px-6 shrink-0" style="background:var(--kb-card);border-bottom:1px solid var(--kb-border);">
  <a href="#" class="flex items-center gap-2 text-sm font-medium" style="color:var(--kb-muted-foreground);">
    <i data-lucide="arrow-left" class="w-4 h-4"></i><span>返回</span>
  </a>
  <div class="flex items-center gap-4">
    <span class="text-sm" style="color:var(--kb-muted-foreground);">前端开发基础</span>
    <span class="px-2 py-0.5 rounded text-xs" style="background:rgba(59,111,224,0.08);color:var(--kb-primary);">第 8/32 题</span>
  </div>
  <div class="flex items-center gap-3">
    <button id="pauseBtn" class="flex items-center gap-1.5 h-8 px-3 rounded-lg text-sm border" style="border-color:var(--kb-border);color:var(--kb-foreground);background:var(--kb-card);">
      <i data-lucide="pause" class="w-3.5 h-3.5"></i>暂停
    </button>
    <button class="p-2 rounded-lg" style="color:var(--kb-muted-foreground);">
      <i data-lucide="settings" class="w-4 h-4"></i>
    </button>
  </div>
</div>

<!-- 主内容区 -->
<div class="flex-1 flex flex-col items-center justify-center px-6 relative">

  <!-- 计时器 -->
  <div class="mb-8 text-center">
    <div class="relative inline-flex items-center justify-center mb-4">
      <svg class="w-56 h-56 -rotate-90" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="90" fill="none" stroke="var(--kb-muted)" stroke-width="4"/>
        <circle class="progress-ring" cx="100" cy="100" r="90" fill="none" stroke="var(--kb-primary)" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="565.48" stroke-dashoffset="141.37"/>
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <div class="timer-display" style="color:var(--kb-foreground);" id="timerDisplay">25:00</div>
        <div class="text-sm mt-1" style="color:var(--kb-muted-foreground);">专注时间</div>
      </div>
    </div>
  </div>

  <!-- 当前题目 / 背诵内容 -->
  <div class="w-full max-w-3xl mb-10">
    <div class="p-8 rounded-2xl border" style="background:var(--kb-card);border-color:var(--kb-border);">
      <div class="flex items-center gap-2 mb-4">
        <span class="px-2.5 py-1 rounded-full text-xs font-medium" style="background:rgba(59,111,224,0.08);color:var(--kb-primary);">JavaScript</span>
        <span class="px-2.5 py-1 rounded-full text-xs font-medium" style="background:rgba(16,185,129,0.08);color:var(--kb-accent);">核心概念</span>
        <span class="px-2.5 py-1 rounded-full text-xs font-medium" style="background:rgba(245,158,11,0.08);color:var(--kb-warning);">重要</span>
      </div>
      <h2 class="text-2xl font-bold mb-4" style="color:var(--kb-foreground);">请解释 JavaScript 中事件循环（Event Loop）的工作机制</h2>
      <p class="leading-relaxed" style="color:var(--kb-muted-foreground);font-size:15px;">
        请在脑海中组织答案，回想以下关键点：调用栈、任务队列、微任务队列、宏任务与微任务的执行顺序，以及 setTimeout 与 Promise 的区别。准备好后点击下方按钮。
      </p>
      <div class="mt-5 p-4 rounded-lg" style="background:var(--kb-background);">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="lightbulb" class="w-4 h-4" style="color:var(--kb-warning);"></i>
          <span class="text-xs font-medium" style="color:var(--kb-warning);">提示</span>
        </div>
        <p class="text-sm" style="color:var(--kb-muted-foreground);">提示：思考同步代码优先执行，然后是微任务（Promise.then），最后才是宏任务（setTimeout）</p>
      </div>
    </div>
  </div>

  <!-- 大按钮 -->
  <div class="flex items-center gap-6 mb-8">
    <button id="reviewBtn" class="flex items-center gap-3 h-16 px-12 rounded-2xl text-lg font-semibold border-2 transition-all hover:scale-[1.02]" style="border-color:var(--kb-warning);color:var(--kb-warning);background:transparent;">
      <i data-lucide="eye" class="w-6 h-6"></i>再看看
    </button>
    <button id="memorizedBtn" class="flex items-center gap-3 h-16 px-12 rounded-2xl text-lg font-semibold transition-all hover:scale-[1.02]" style="background:var(--kb-accent);color:var(--kb-accent-foreground);">
      <i data-lucide="check-circle" class="w-6 h-6"></i>我记住了
    </button>
  </div>

  <!-- 底部进度 -->
  <div class="w-full max-w-xl">
    <div class="flex items-center justify-between mb-2">
      <span class="text-sm" style="color:var(--kb-muted-foreground);">学习进度</span>
      <span class="text-sm font-medium" style="color:var(--kb-primary);">8 / 32</span>
    </div>
    <div class="h-2 rounded-full overflow-hidden" style="background:var(--kb-muted);">
      <div class="h-full rounded-full transition-all" style="width:25%;background:var(--kb-primary);"></div>
    </div>
  </div>

</div>

<!-- 右下角设置浮动面板 -->
<div class="fixed bottom-6 right-6">
  <div id="settingsPanel" class="hidden mb-3 p-5 rounded-xl border shadow-xl w-72" style="background:var(--kb-card);border-color:var(--kb-border);">
    <h4 class="text-sm font-semibold mb-4" style="color:var(--kb-foreground);">学习设置</h4>
    <div class="space-y-4">
      <div>
        <label class="text-xs font-medium mb-1.5 block" style="color:var(--kb-muted-foreground);">学习目标</label>
        <div class="flex items-center gap-2">
          <button class="flex-1 h-8 rounded-lg text-xs font-medium border" style="border-color:var(--kb-primary);color:var(--kb-primary);background:rgba(59,111,224,0.08);">20 分钟</button>
          <button class="flex-1 h-8 rounded-lg text-xs font-medium border" style="border-color:var(--kb-border);color:var(--kb-muted-foreground);background:var(--kb-card);">25 分钟</button>
          <button class="flex-1 h-8 rounded-lg text-xs font-medium border" style="border-color:var(--kb-border);color:var(--kb-muted-foreground);background:var(--kb-card);">45 分钟</button>
        </div>
      </div>
      <div>
        <label class="text-xs font-medium mb-1.5 block" style="color:var(--kb-muted-foreground);">题目数量</label>
        <select class="w-full h-9 rounded-lg border text-sm outline-none" style="background:var(--kb-background);border-color:var(--kb-border);color:var(--kb-foreground);">
          <option>10 题</option>
          <option>20 题</option>
          <option selected>32 题（全部）</option>
          <option>50 题</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-medium mb-1.5 block" style="color:var(--kb-muted-foreground);">自动翻页间隔</label>
        <select class="w-full h-9 rounded-lg border text-sm outline-none" style="background:var(--kb-background);border-color:var(--kb-border);color:var(--kb-foreground);">
          <option>不自动翻页</option>
          <option>15 秒</option>
          <option>30 秒</option>
          <option>60 秒</option>
        </select>
      </div>
      <div class="pt-2 flex gap-2">
        <button class="flex-1 h-9 rounded-lg text-sm font-medium border" style="border-color:var(--kb-border);color:var(--kb-foreground);background:var(--kb-card);">暂停</button>
        <button class="flex-1 h-9 rounded-lg text-sm font-medium" style="background:var(--kb-destructive);color:var(--kb-primary-foreground);">退出学习</button>
      </div>
    </div>
  </div>
  <button id="settingsBtn" class="w-12 h-12 rounded-full flex items-center justify-center shadow-lg border" style="background:var(--kb-card);border-color:var(--kb-border);color:var(--kb-muted-foreground);">
    <i data-lucide="settings" class="w-5 h-5"></i>
  </button>
</div>

<script>
lucide.createIcons();

// 设置面板 toggle
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
settingsBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('hidden');
});

// 暂停按钮
const pauseBtn = document.getElementById('pauseBtn');
let isPaused = false;
pauseBtn.addEventListener('click', () => {
  isPaused = !isPaused;
  pauseBtn.innerHTML = isPaused
    ? '<i data-lucide="play" class="w-3.5 h-3.5"></i>继续'
    : '<i data-lucide="pause" class="w-3.5 h-3.5"></i>暂停';
  lucide.createIcons();
});

// 简单计时器倒计时
let seconds = 25 * 60;
const timerDisplay = document.getElementById('timerDisplay');
setInterval(() => {
  if (!isPaused && seconds > 0) {
    seconds--;
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    timerDisplay.textContent = m + ':' + s;
  }
}, 1000);
</script>

    <style>
.timer-display { font-family: 'Inter', monospace; font-size: 96px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
.progress-ring { transition: stroke-dashoffset 0.5s ease; }
@keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
.pulse-active { animation: pulse-glow 2s ease-in-out infinite; }
    </style>
</body>
</html>
