<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重定向</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

@theme inline {
  --color-kb-background: #F7F8FA;
  --color-kb-foreground: #1A1D23;
  --color-kb-card: #FFFFFF;
  --color-kb-card-foreground: #1A1D23;
  --color-kb-popover: #FFFFFF;
  --color-kb-popover-foreground: #1A1D23;
  --color-kb-primary: #3B6FE0;
  --color-kb-primary-foreground: #FFFFFF;
  --color-kb-muted: #E8ECF1;
  --color-kb-muted-foreground: #6B7280;
  --color-kb-border: #E2E6EC;
  --color-kb-input: #E2E6EC;
  --color-kb-ring: #3B6FE0;
  --color-kb-sidebar: #F0F2F5;
  --color-kb-sidebar-foreground: #374151;
  --color-kb-state-success: #10B981;
  --color-kb-state-success-foreground: #FFFFFF;
  --color-kb-state-error: #EF4444;
  --color-kb-state-error-foreground: #FFFFFF;
  --color-kb-state-warning: #F59E0B;
  --color-kb-state-warning-foreground: #FFFFFF;
  --color-kb-radius-sm: 6px;
  --color-kb-radius-md: 10px;
  --color-kb-radius-lg: 16px;
}

:root {
  --kb-background: #F7F8FA;
  --kb-foreground: #1A1D23;
  --kb-card: #FFFFFF;
  --kb-card-foreground: #1A1D23;
  --kb-popover: #FFFFFF;
  --kb-popover-foreground: #1A1D23;
  --kb-primary: #3B6FE0;
  --kb-primary-foreground: #FFFFFF;
  --kb-muted: #E8ECF1;
  --kb-muted-foreground: #6B7280;
  --kb-border: #E2E6EC;
  --kb-input: #E2E6EC;
  --kb-ring: #3B6FE0;
  --kb-sidebar: #F0F2F5;
  --kb-sidebar-foreground: #374151;
  --kb-state-success: #10B981;
  --kb-state-success-foreground: #FFFFFF;
  --kb-state-error: #EF4444;
  --kb-state-error-foreground: #FFFFFF;
  --kb-state-warning: #F59E0B;
  --kb-state-warning-foreground: #FFFFFF;
  --kb-radius-sm: 6px;
  --kb-radius-md: 10px;
  --kb-radius-lg: 16px;
  --font-sans: 'Noto Sans SC', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
}

/* Semantic token fallback */
#semantic-token-fallback {
  --background: var(--kb-background);
  --foreground: var(--kb-foreground);
  --card: var(--kb-card);
  --card-foreground: var(--kb-card-foreground);
  --popover: var(--kb-popover);
  --popover-foreground: var(--kb-popover-foreground);
  --primary: var(--kb-primary);
  --primary-foreground: var(--kb-primary-foreground);
  --muted: var(--kb-muted);
  --muted-foreground: var(--kb-muted-foreground);
  --border: var(--kb-border);
  --input: var(--kb-input);
  --ring: var(--kb-ring);
  --sidebar: var(--kb-sidebar);
  --sidebar-foreground: var(--kb-sidebar-foreground);
  --radius-sm: var(--kb-radius-sm);
  --radius-md: var(--kb-radius-md);
  --radius-lg: var(--kb-radius-lg);
}

/* Typography scale */
.kb-h1 {
  font-family: var(--font-sans);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.02em;
  color: var(--kb-foreground);
}

.kb-h2 {
  font-family: var(--font-sans);
  font-size: 22px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.01em;
  color: var(--kb-foreground);
}

.kb-h3 {
  font-family: var(--font-sans);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--kb-foreground);
}

.kb-h4 {
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.45;
  color: var(--kb-foreground);
}

.kb-body {
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--kb-card-foreground);
}

.kb-body-sm {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--kb-muted-foreground);
}

.kb-caption {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--kb-muted-foreground);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;

<body class="min-h-screen flex items-center justify-center" style="background-color: var(--kb-background);">
    <main class="flex items-center justify-center w-full px-4">
        <div class="max-w-[480px] w-full text-center py-16 px-8">
            <!-- Spinner -->
            <div class="flex justify-center mb-6">
                <div class="w-12 h-12 rounded-full border-[3px] border-solid" style="border-color: var(--kb-primary); border-top-color: transparent;"></div>
            </div>
            <!-- Title -->
            <h1 class="text-xl font-semibold mb-2" style="color: var(--kb-foreground);">正在跳转...</h1>
            <!-- Description -->
            <p class="text-sm mb-6" style="color: var(--kb-muted-foreground);">即将前往智能问答对话页面</p>
            <!-- Manual link -->
            <a href="chat.html" data-dom-id="redirect-to-chat" class="text-sm underline" style="color: var(--kb-primary);">如果没有自动跳转，点击此处</a>
            <!-- Countdown -->
            <p class="text-xs mt-4" style="color: var(--kb-muted-foreground);">3 秒后自动跳转</p>
        </div>
    </main>

    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .w-12.h-12.rounded-full {
            animation: spin 1s linear infinite;
        }
    </style>
</body>
</html>
