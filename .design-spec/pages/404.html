  --font-sans: 'Noto Sans SC', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
}

/* Semantic token fallback */
#semantic-token-fallback {
  --background: var(--kb-background);
  --foreground: var(--kb-foreground);
  --card: var(--kb-card);
  --card-foreground: var(--kb-card-foreground);
  --popover: var(--kb-popover);
  --popover-foreground: var(--kb-popover-foreground);
  --primary: var(--kb-primary);
  --primary-foreground: var(--kb-primary-foreground);
  --muted: var(--kb-muted);
  --muted-foreground: var(--kb-muted-foreground);
  --border: var(--kb-border);
  --input: var(--kb-input);
  --ring: var(--kb-ring);
  --sidebar: var(--kb-sidebar);
  --sidebar-foreground: var(--kb-sidebar-foreground);
  --radius-sm: var(--kb-radius-sm);
  --radius-md: var(--kb-radius-md);
  --radius-lg: var(--kb-radius-lg);
}

/* Typography scale */
.kb-h1 {
  font-family: var(--font-sans);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.02em;
  color: var(--kb-foreground);
}

.kb-h2 {
  font-family: var(--font-sans);
  font-size: 22px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.01em;
  color: var(--kb-foreground);
}

.kb-h3 {
  font-family: var(--font-sans);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--kb-foreground);
}

.kb-h4 {
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.45;
  color: var(--kb-foreground);
}

.kb-body {
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--kb-card-foreground);
}

.kb-body-sm {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--kb-muted-foreground);
}

.kb-caption {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--kb-muted-foreground);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

    <style type="text/tailwindcss">

<body class="min-h-screen font-sans antialiased">
    <main class="flex items-center justify-center min-h-screen px-4">
      <div class="flex flex-col items-center text-center max-w-[480px] w-full">
        <!-- CSS Book Illustration -->
        <div class="relative mb-8">
          <!-- Book body -->
          <div class="relative w-24 h-28 rounded-md overflow-hidden" style="background: var(--kb-muted);">
            <!-- Book spine -->
            <div class="absolute left-0 top-0 bottom-0 w-2 rounded-l-md" style="background: var(--kb-primary); opacity: 0.5;"></div>
            <!-- Book pages (lines) -->
            <div class="absolute top-5 left-5 right-3 flex flex-col gap-1.5">
              <div class="h-1 rounded-full w-full" style="background: var(--kb-border);"></div>
              <div class="h-1 rounded-full w-4/5" style="background: var(--kb-border);"></div>
              <div class="h-1 rounded-full w-full" style="background: var(--kb-border);"></div>
              <div class="h-1 rounded-full w-3/5" style="background: var(--kb-border);"></div>
              <div class="h-1 rounded-full w-full" style="background: var(--kb-border);"></div>
            </div>
          </div>
          <!-- Question mark -->
          <div class="absolute -right-2 -top-3 w-8 h-8 rounded-full flex items-center justify-center" style="background: var(--kb-primary);">
            <span class="text-white font-bold text-sm">?</span>
          </div>
        </div>

        <!-- 404 Number -->
        <h1 class="font-bold leading-none tracking-tight" style="font-size: 120px; color: var(--kb-primary); opacity: 0.18;">404</h1>

        <!-- Subtitle -->
        <p class="kb-h2 mt-4" style="color: var(--kb-foreground);">抱歉，你访问的页面不存在</p>

        <!-- Description -->
        <p class="kb-body mt-3" style="color: var(--kb-muted-foreground);">可能是链接已失效，或者你输入了错误的地址</p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center gap-3 mt-8 w-full sm:justify-center">
          <a href="#" data-dom-id="error-back-home" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-medium transition-colors" style="background: var(--kb-primary); color: var(--kb-primary-foreground);">
            <i data-lucide="home" class="w-4 h-4"></i>
            返回首页
          </a>
          <a href="#" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-medium transition-colors" style="background: transparent; color: var(--kb-foreground); border: 1px solid var(--kb-border);">
            <i data-lucide="search" class="w-4 h-4"></i>
            搜索知识库
          </a>
        </div>
      </div>
