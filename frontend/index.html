<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 主题色：与 --kb-primary 保持一致，影响浏览器地址栏/状态栏着色（移动端尤甚） -->
    <meta name="theme-color" content="#3B6FE0" />
    <!-- 描述：SEO 与分享卡片基础信息 -->
    <meta name="description" content="KnowFlow — AI 驱动的知识学习平台，构建「智能学习门户 → 沉浸式学习助手 → 实战演练场 → 学习成果度量 → 社区激励」全链路学习闭环。" />

    <!-- 字体预连接：减少 Google Fonts 首次请求延迟 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- P3-1：深色模式防闪烁（FOUC）内联脚本，在 CSS 加载前同步应用主题 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('kb-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>

    <title>KnowFlow · AI 驱动的知识学习平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
