server:
  port: 8080

spring:
  application:
    name: knowflow-backend

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:knowflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    sql-script-encoding: UTF-8

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  secret: ${JWT_SECRET:knowflow-dev-secret-key-please-change-in-production-32bytes}
  expire: 86400000

ai:
  api-key: ${AI_API_KEY:sk-placeholder-replace-with-your-key}
  base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
  model: ${AI_MODEL:deepseek-chat}
  max-tokens: ${AI_MAX_TOKENS:8000}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:180}
  max-content-chars: ${AI_MAX_CONTENT_CHARS:20000}
  models: ${AI_MODELS:deepseek-chat,gpt-4o,claude-3-5-sonnet,qwen-plus}

# 第三方 OAuth 登录配置
# GitHub: https://github.com/settings/developers 创建 OAuth App 获取
# 微信: https://open.weixin.qq.com 创建网站应用获取
oauth:
  frontend-base-url: ${OAUTH_FRONTEND_BASE_URL:http://localhost:5173}
  github:
    client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
    client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/oauth/github/callback}
  wechat:
    app-id: ${WECHAT_APP_ID:your-wechat-app-id}
    app-secret: ${WECHAT_APP_SECRET:your-wechat-app-secret}
    redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:8080/api/auth/oauth/wechat/callback}

logging:
  level:
    root: info
    com.knowflow: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
