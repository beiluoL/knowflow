server:
  port: 8080

spring:
  application:
    name: knowflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # 数据源由 DynamicDataSourceConfig 接管（见 knowflow.datasource）。
  # 必须关闭 Spring Boot 自带的脚本初始化器：否则它会按默认约定再次执行
  # classpath:schema.sql，与动态数据源已执行的方言脚本重复导致建索引冲突。
  sql:
    init:
      mode: never

  h2:
    console:
      # 生产默认关闭；仅本地开发由 application-local.yml 开启
      enabled: false
      path: /h2-console

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 500MB
      file-size-threshold: 2KB

# ============================================================
# 数据库切换配置
# 只需修改 type（h2 / mysql）即可切换数据库，无需改动任何代码。
#   - h2   : 开发测试环境，内存库，每次启动重建表并灌入演示数据
#   - mysql: 生产环境，持久化，默认仅首次建表（init-mode=auto）
# 也可在后台「数据库设置」页面运行时热切换，切换结果会写入
# config-file 指定的外置文件，其优先级高于此处的 type。
# ============================================================
knowflow:
  # 默认关闭；仅 local 配置显式开启的本机浏览器开发工具认证。
  developer-tools:
    enabled: false
  # 宿主机能力默认关闭；ADMIN、localhost、开发 profile 均不会自动放行。
  host-capabilities:
    enabled: ${HOST_CAPABILITIES_ENABLED:false}
    authorized-user-ids: ${HOST_CAPABILITIES_AUTHORIZED_USER_IDS:}
    allowed-roots: ${HOST_CAPABILITIES_ALLOWED_ROOTS:}
  datasource:
    type: ${DB_TYPE:h2}
    # 是否允许通过后台页面运行时热切换；生产可设为 false 防误操作
    allow-runtime-switch: ${DB_ALLOW_RUNTIME_SWITCH:true}
    # 热切换结果持久化位置（不写回 jar 内的 application.yml）
    config-file: ${DB_CONFIG_FILE:./config/datasource.json}

    h2:
      url: jdbc:h2:mem:knowflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      username: sa
      password: ""
      schema-location: classpath:db/h2/schema.sql
      data-location: classpath:db/h2/data.sql
      # 内存库每次启动都需重建
      init-mode: always
      maximum-pool-size: 10
      minimum-idle: 2

    mysql:
      # 生产务必开启 utf8mb4 与时区，否则中文/emoji 写入异常
      url: ${MYSQL_URL:jdbc:mysql://localhost:3306/knowflow?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:}
      schema-location: classpath:db/mysql/schema.sql
      data-location: classpath:db/mysql/data.sql
      # auto：库中无业务表时才建表灌数据，避免重启清空生产数据
      init-mode: ${MYSQL_INIT_MODE:auto}
      maximum-pool-size: 20
      minimum-pool-size: 5

  # Phase 3H：统一 AI 能力护栏（超时/重试/熔断/并发/预算）。
  # AI 是增强层：关闭或故障不影响题库、规则组卷、考试、客观判分、错题等 A 类核心功能。
  ai:
    capability:
      # 系统 AI 总开关；false 时所有 AI 增强进入基础模式
      enabled: ${KNOWFLOW_AI_CAPABILITY_ENABLED:true}
      # 可重试错误（429/5xx/超时/网络）的最大尝试次数（含首次）
      max-attempts: ${KNOWFLOW_AI_MAX_ATTEMPTS:3}
      # 指数退避：首次重试等待（毫秒），上限（毫秒）
      initial-backoff-ms: ${KNOWFLOW_AI_INITIAL_BACKOFF_MS:500}
      max-backoff-ms: ${KNOWFLOW_AI_MAX_BACKOFF_MS:8000}
      # 全局并发上限与获取许可的等待时间
      max-concurrent: ${KNOWFLOW_AI_MAX_CONCURRENT:8}
      acquire-timeout-ms: ${KNOWFLOW_AI_ACQUIRE_TIMEOUT_MS:100}
      # 熔断：统计窗口、窗口内失败阈值、打开后冷却（毫秒）
      circuit-window-ms: ${KNOWFLOW_AI_CIRCUIT_WINDOW_MS:60000}
      circuit-failure-threshold: ${KNOWFLOW_AI_CIRCUIT_FAILURE_THRESHOLD:6}
      circuit-open-ms: ${KNOWFLOW_AI_CIRCUIT_OPEN_MS:30000}
      # 每日 token 预算；0 表示不限制
      daily-token-limit: ${KNOWFLOW_AI_DAILY_TOKEN_LIMIT:0}
      # 能力状态接口缓存秒数（不发起付费健康检查，仅聚合配置与近期调用结果）
      status-cache-seconds: ${KNOWFLOW_AI_STATUS_CACHE_SECONDS:30}
      # 瞬时失败状态在七态中的保留时长
      transient-state-ttl-seconds: ${KNOWFLOW_AI_TRANSIENT_TTL:60}

  # Phase 3H：确定性智能练习规则引擎（REVIEW 策略），完全不依赖 AI
  smart-practice:
    # 错题复习到期窗口（天）；1 与错题 dueToday 口径一致
    review-due-days: ${KNOWFLOW_SMART_REVIEW_DUE_DAYS:1}
    weights:
      due-review: 30
      high-freq-mistake: 25
      weak-topic: 20
      target-topic: 15
      new-unanswered: 10

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产使用 slf4j 以免 stdout 刷屏；本地由 application-local.yml 覆盖为 StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  # 必须显式配置；未设置 JWT_SECRET 时启动失败（fail-fast），避免被伪造令牌
  secret: ${JWT_SECRET}
  expire: 86400000

ai:
  api-key: ${AI_API_KEY:${DEEP_SEEK_API_KEY:${DEEPSEEK_API_KEY:sk-placeholder-replace-with-your-key}}}
  base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
  model: ${AI_MODEL:deepseek-chat}
  # Embedding 独立配置：对话模型与嵌入模型通常来自不同厂商。
  # 例如 base-url 指向 DeepSeek 时，DeepSeek 并不提供 /embeddings 接口，
  # 若共用 base-url 会导致向量化恒失败、doc_chunk.embedding 全为 NULL、语义检索失效。
  # 留空时默认使用本地 Ollama（http://localhost:11434/v1），绝不回退到对话模型地址。
  embedding-base-url: ${AI_EMBEDDING_BASE_URL:}
  embedding-api-key: ${AI_EMBEDDING_API_KEY:}
  embedding-model: ${AI_EMBEDDING_MODEL:nomic-embed-text}
  # 单次批量向量化的最大文本条数，用于导入时批量提交降低往返开销
  embedding-batch-size: ${AI_EMBEDDING_BATCH_SIZE:16}
  max-tokens: ${AI_MAX_TOKENS:8000}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:180}
  max-content-chars: ${AI_MAX_CONTENT_CHARS:20000}
  models: ${AI_MODELS:deepseek-chat,gpt-4o,claude-3-5-sonnet,qwen-plus}

# 代码在线运行沙箱（SC1-IDE-01）：后端进程直执行 Python/Java/JS/C++
# 生产环境建议替换为 Judge0 / Docker 隔离执行，此直执行方案仅作地基（超时 + 独立临时目录 + 并发信号量）。
code:
  execution:
    # 单次执行超时（毫秒），超时强制 kill
    time-limit-ms: 10000
    # 标准输出/错误截断上限（字节）
    output-limit-bytes: 1048576
    # 最大并发执行数（信号量控制，防资源耗尽）
    max-concurrency: 8
    # 各语言可执行文件（PATH 中名称或绝对路径，生产可在容器内固定）
    python-bin: python3
    node-bin: node
    java-bin: java
    javac-bin: javac
    gpp-bin: g++
    # 用户工作区根目录（SC1-IDE-02 可重置实验沙箱）：按 userId 隔离为 {root}/{userId}/
    workspace-root: ./code-workspaces

# 第三方 OAuth 登录配置
# GitHub: https://github.com/settings/developers 创建 OAuth App 获取
# 微信: https://open.weixin.qq.com 创建网站应用获取
oauth:
  frontend-base-url: ${OAUTH_FRONTEND_BASE_URL:http://localhost:5173}
  github:
    client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
    client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/oauth/github/callback}
  wechat:
    app-id: ${WECHAT_APP_ID:your-wechat-app-id}
    app-secret: ${WECHAT_APP_SECRET:your-wechat-app-secret}
    redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:8080/api/auth/oauth/wechat/callback}

logging:
  level:
    root: info
    com.knowflow: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
