    rubric:
      level1: 只能说出关键字名称
      level3: 能解释可见性与原子性边界
      level5: 能结合压测或故障说明设计与验证
    references: [Java 并发题库, JUC 源码]

  - id: rag
    name: RAG 检索增强
    category: ai
    level: 高级
    roles: [AI 应用开发工程师, RAG 工程师]
    minYears: 2
    maxYears: 10
    difficulty: HARD
    trackCode: RAG
    tags: [分块, Embedding, 检索, 重排, 评测]
    jdKeywords: [RAG, 检索增强, Embedding, 向量检索, Rerank, 召回, 知识库]
    instructions: 考察文档解析、分块、嵌入、混合检索、重排、引用与评测；重点是权限过滤和忠实度，而不是堆模型名。
    questionRules:
      - 从 RAG 方向抽题。
      - 至少一道题要求说明多租户权限过滤与评测方法。
    followupRules:
      - 追问召回指标、引用准确率与失败模式。
      - 证据不足时明确说明未验证。
    rubric:
      level1: 只描述“向量库 + 大模型”
      level3: 能讲清检索链路与常见失败
      level5: 能给出评测集、权限过滤与重排取舍的工程方案
    references: [RAG 题库, 向量检索文档]

