# KnowFlow 面试 Skill Registry（Phase 1）
# 每个条目等价于 InterviewGuide 的 SKILL.md + skill.meta.yml + question/evaluation/followup 规则。
# 只登记既有题库方向（trackCode 来自 InterviewQuestionBank.TRACKS），不重新生成或覆盖题目 ID。
version: v1
skills:
  - id: java-backend
    name: Java 后端工程师
    category: java
    level: 中级
    roles: [Java 后端工程师, Java 开发工程师, 后端开发工程师]
    minYears: 2
    maxYears: 5
    difficulty: MEDIUM
    trackCode: JAVA_BASIC
    tags: [Java, 集合, 异常, 泛型, IO]
    jdKeywords: [Java, Spring Boot, MySQL, Redis, MyBatis, 并发, 后端]
    instructions: 考察 Java 语言基础、集合与异常契约、常用框架和数据访问；要求候选人讲清原理、使用场景与边界，不接受只背结论。
    questionRules:
      - 从 Java 基础方向既有题库抽题，保留原题 ID 与来源。
      - 每题至少覆盖一个原理点和一个工程场景。
    followupRules:
      - 只追问回答中缺失的因果或边界，不提前给出答案。
      - 同一知识点最多连续追问两层。
    rubric:
      level1: 只能复述结论，无法解释原因
      level3: 能讲清核心原理与常见用法
      level5: 能说明源码/参数、失效边界与真实排障经验
    references: [Java 基础题库, Spring 官方文档, JDK 源码]

  - id: java-senior
    name: Java 高级开发
    category: java
    level: 高级
    roles: [Java 高级开发工程师, 资深后端工程师, 技术专家]
    minYears: 5
    maxYears: 12
    difficulty: HARD
    trackCode: JAVA_CONCURRENCY
    tags: [并发, JUC, 线程池, 锁, JMM]
    jdKeywords: [并发编程, JUC, 线程池, 高性能, 高并发, 分布式]
    instructions: 考察并发模型、锁与线程池设计、内存可见性和线上故障处理；重点是取舍与验证，不鼓励堆砌名词。
    questionRules:
      - 优先从并发方向题库抽题，必要时结合 JVM 与框架题。
      - 至少一道题要求给出可验证的排障或压测方案。
    followupRules:
      - 追问失败条件、因果链与恢复过程。
      - 不引入候选人未提及的具体实现方案作为前提。
    rubric:
      level1: 概念混淆，无法说明并发风险
      level3: 能解释主要机制并给出常见方案
      level5: 能结合真实故障、指标与取舍说明设计边界
    references: [Java 并发题库, JUC 源码, JMM 规范]

  - id: java-ai-engineer
    name: Java + AI 工程师
    category: ai
    level: 高级
    roles: [Java + AI 工程师, AI 应用开发工程师, 全栈 AI 工程师]
    minYears: 3
    maxYears: 10
    difficulty: HARD
    trackCode: JAVA_AI_SCENE
    tags: [Spring AI, LangChain4j, RAG, 模型接入, 降级]
    jdKeywords: [RAG, LLM, 大模型, Spring AI, LangChain4j, Embedding, 向量, Agent]
    instructions: 考察 Java 服务中集成 LLM 的分层设计、超时重试降级、Prompt 版本、密钥隔离与可观测性；AI 必须作为增强层而非唯一路径。
    questionRules:
      - 从 Java + AI 项目实战方向抽题，保留原题 ID。
      - 必须包含一道无 AI 时业务仍可完成的降级题。
    followupRules:
      - 追问模型失败、限流、成本与数据出境边界。
      - 对没有真实证据的项目经历，只提问不判定为事实。
    rubric:
      level1: 只谈调用 SDK，没有工程边界
      level3: 能说明分层、失败分类和基础降级
      level5: 能给出可观测、成本控制与安全边界的完整方案
    references: [Java + AI 实战题库, RAG 题库, Agent / MCP 题库]

  - id: spring-boot
    name: Spring / Spring Boot
    category: framework
    level: 中级
    roles: [Spring Boot 开发工程师, Java 后端工程师]
    minYears: 2
    maxYears: 8
    difficulty: MEDIUM
    trackCode: FRAMEWORK_STORAGE
    tags: [Spring, Bean 生命周期, 事务, AOP, 循环依赖]
    jdKeywords: [Spring, Spring Boot, Spring MVC, 事务, AOP, Bean]
    instructions: 考察 Bean 生命周期、循环依赖、事务传播、AOP 代理与自调用失效等框架原理，要求结合真实项目说明。
    questionRules:
      - 从 Spring / MySQL / Redis 方向抽取框架题。
      - 至少一道题要求说明事务或代理的失效场景。
    followupRules:
      - 追问失效原因和最小复现方式。
      - 不把框架默认行为当成候选人已掌握。
    rubric:
      level1: 只会使用注解，不知道生效条件
      level3: 能讲清生命周期和事务基本机制
      level5: 能解释三级缓存、代理与失效边界并给出验证方法
    references: [Spring 框架题库, Spring 官方文档]

  - id: jvm-gc
    name: JVM / GC
    category: java
    level: 高级
    roles: [Java 高级开发工程师, 性能优化工程师]
    minYears: 3
    maxYears: 12
    difficulty: HARD
    trackCode: JVM
    tags: [JVM, GC, 类加载, 内存模型, 调优]
    jdKeywords: [JVM, GC, 垃圾回收, 内存泄漏, 调优, 类加载]
    instructions: 考察内存区域、GC 算法与收集器、类加载和故障排查；要求用真实工具与指标说明，不背参数。
    questionRules:
      - 从 JVM 方向抽题，覆盖内存、GC 和类加载。
      - 至少一道题要求给出从现象到根因的排查路径。
    followupRules:
      - 追问观测指标、工具输出和验证步骤。
      - 不提示具体参数值作为答案。
    rubric:
      level1: 混淆内存区域或收集器定位
      level3: 能说明 GC 流程与常见排查工具
      level5: 能基于日志/堆转储给出可验证的调优结论
    references: [JVM 题库, OpenJDK 源码, GC 日志规范]

  - id: mysql-redis
    name: MySQL / Redis
    category: storage
    level: 中级
    roles: [Java 后端工程师, 数据库开发工程师]
    minYears: 2
    maxYears: 8
    difficulty: MEDIUM
    trackCode: FRAMEWORK_STORAGE
    tags: [MySQL, 索引, 事务, Redis, 缓存]
    jdKeywords: [MySQL, InnoDB, 索引, 事务, Redis, 缓存, 分库分表]
    instructions: 考察 B+ 树索引、最左前缀、事务隔离、缓存穿透/击穿/雪崩与一致性方案；要求区分已验证结论与猜测。
    questionRules:
      - 抽取索引与缓存相关题，避免与 Spring 题重复。
      - 至少一道题要求说明一致性或失效边界。
    followupRules:
      - 追问执行计划、命中率或一致性验证。
      - 不把未验证的线上数据说成事实。
    rubric:
      level1: 只会背索引名词
      level3: 能解释索引结构与缓存问题
      level5: 能结合 EXPLAIN、命中率与一致性方案说明取舍
    references: [MySQL / Redis 题库, InnoDB 文档]

