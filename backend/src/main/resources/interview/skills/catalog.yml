  - id: project-defense
    name: 项目答辩
    category: project
    level: 中级
    roles: [Java 后端工程师, Java + AI 工程师]
    minYears: 1
    maxYears: 15
    difficulty: MEDIUM
    trackCode: PROJECT
    tags: [项目经历, 职责边界, 证据, 复盘]
    jdKeywords: [项目经历, 项目答辩, 技术难点, 个人职责, 复盘]
    instructions: 只依据用户提供的真实资料提问，区分已实现与规划；没有证据的内容不判定为事实，也不编造 QPS 或个人贡献。
    questionRules:
      - 使用项目专项题，必须携带用户授权的资料证据。
      - 至少一道题要求指出可核对证据与未验证部分。
    followupRules:
      - 追问设计取舍、故障处理和本人实际职责。
      - 资料不足时明确提示“证据不足”。
    rubric:
      level1: 无法说明本人职责或项目边界
      level3: 能讲清链路与部分取舍
      level5: 能用真实资料说明取舍、边界与验证结果
