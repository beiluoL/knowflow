<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库下拉组件</title>
    <style id="theme-vars">
:root {
  --kb-background: #f8fafc;
  --kb-foreground: #0f172a;
  --kb-card: #ffffff;
  --kb-card-foreground: #0f172a;
  --kb-popover: #ffffff;
  --kb-popover-foreground: #0f172a;
  --kb-primary: #0d9488;
  --kb-primary-foreground: #ffffff;
  --kb-muted: #f1f5f9;
  --kb-muted-foreground: #64748b;
  --kb-border: #e2e8f0;
  --kb-input: #e2e8f0;
  --kb-ring: #0d9488;
  --kb-radius-sm: 4px;
  --kb-radius-md: 8px;
  --kb-radius-lg: 16px;

  --bg: var(--kb-background);
  --surface: var(--kb-card);
  --surface-2: var(--kb-muted);
  --ink: var(--kb-foreground);
  --ink-2: var(--kb-muted-foreground);
  --ink-3: #94a3b8;
  --line: var(--kb-border);
  --brand: var(--kb-primary);
  --brand-ink: var(--kb-primary-foreground);

  --state-success: #10b981;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);
  --shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.30);

  --font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Noto Sans Mono SC", monospace;
}

html.dark {
  --kb-background: #0b0f14;
  --kb-foreground: #f1f5f9;
  --kb-card: #111827;
  --kb-card-foreground: #f1f5f9;
  --kb-popover: #111827;
  --kb-popover-foreground: #f1f5f9;
  --kb-primary: #14b8a6;
  --kb-primary-foreground: #020617;
  --kb-muted: #1e293b;
  --kb-muted-foreground: #94a3b8;
  --kb-border: #1e293b;
  --kb-input: #1e293b;
  --kb-ring: #14b8a6;

  --bg: var(--kb-background);
  --surface: var(--kb-card);
  --surface-2: var(--kb-muted);
  --ink: var(--kb-foreground);
  --ink-2: var(--kb-muted-foreground);
  --ink-3: #64748b;
  --line: var(--kb-border);
  --brand: var(--kb-primary);
  --brand-ink: var(--kb-primary-foreground);
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--kb-background);
    --color-foreground: var(--kb-foreground);
    --color-card: var(--kb-card);
    --color-card-foreground: var(--kb-card-foreground);
    --color-popover: var(--kb-popover);
    --color-popover-foreground: var(--kb-popover-foreground);
    --color-primary: var(--kb-primary);
    --color-primary-foreground: var(--kb-primary-foreground);
    --color-muted: var(--kb-muted);
    --color-muted-foreground: var(--kb-muted-foreground);
    --color-border: var(--kb-border);
    --color-input: var(--kb-input);
    --color-ring: var(--kb-ring);
    --radius-sm: var(--kb-radius-sm);
    --radius-md: var(--kb-radius-md);
    --radius-lg: var(--kb-radius-lg);
  }
  @layer base {
    body { background: var(--kb-background); color: var(--kb-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--kb-background); }
      .text-background { color: var(--kb-background); }
      .border-background { border-color: var(--kb-background); }
      .ring-background { --tw-ring-color: var(--kb-background); }
      .bg-foreground { background-color: var(--kb-foreground); }
      .text-foreground { color: var(--kb-foreground); }
      .border-foreground { border-color: var(--kb-foreground); }
      .ring-foreground { --tw-ring-color: var(--kb-foreground); }
      .bg-card { background-color: var(--kb-card); }
      .text-card { color: var(--kb-card); }
      .border-card { border-color: var(--kb-card); }
      .ring-card { --tw-ring-color: var(--kb-card); }
      .bg-card-foreground { background-color: var(--kb-card-foreground); }
      .text-card-foreground { color: var(--kb-card-foreground); }
      .border-card-foreground { border-color: var(--kb-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--kb-card-foreground); }
      .bg-popover { background-color: var(--kb-popover); }
      .text-popover { color: var(--kb-popover); }
      .border-popover { border-color: var(--kb-popover); }
      .ring-popover { --tw-ring-color: var(--kb-popover); }
      .bg-popover-foreground { background-color: var(--kb-popover-foreground); }
      .text-popover-foreground { color: var(--kb-popover-foreground); }
      .border-popover-foreground { border-color: var(--kb-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--kb-popover-foreground); }
      .bg-primary { background-color: var(--kb-primary); }
      .text-primary { color: var(--kb-primary); }
      .border-primary { border-color: var(--kb-primary); }
      .ring-primary { --tw-ring-color: var(--kb-primary); }
      .bg-primary-foreground { background-color: var(--kb-primary-foreground); }
      .text-primary-foreground { color: var(--kb-primary-foreground); }
      .border-primary-foreground { border-color: var(--kb-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--kb-primary-foreground); }
      .bg-muted { background-color: var(--kb-muted); }
      .text-muted { color: var(--kb-muted); }
      .border-muted { border-color: var(--kb-muted); }
      .ring-muted { --tw-ring-color: var(--kb-muted); }
      .bg-muted-foreground { background-color: var(--kb-muted-foreground); }
      .text-muted-foreground { color: var(--kb-muted-foreground); }
      .border-muted-foreground { border-color: var(--kb-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--kb-muted-foreground); }
      .bg-border { background-color: var(--kb-border); }
      .text-border { color: var(--kb-border); }
      .border-border { border-color: var(--kb-border); }
      .ring-border { --tw-ring-color: var(--kb-border); }
      .bg-input { background-color: var(--kb-input); }
      .text-input { color: var(--kb-input); }
      .border-input { border-color: var(--kb-input); }
      .ring-input { --tw-ring-color: var(--kb-input); }
      .bg-ring { background-color: var(--kb-ring); }
      .text-ring { color: var(--kb-ring); }
      .border-ring { border-color: var(--kb-ring); }
      .ring-ring { --tw-ring-color: var(--kb-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
        <section class="w-full max-w-[1200px] mx-auto px-6 py-16 md:py-24">
            <div class="max-w-3xl">
                <h1 class="text-4xl md:text-5xl font-semibold tracking-tight text-foreground mb-5" style="text-wrap: balance; word-break: keep-all;">知识库下拉组件</h1>
                <p class="text-lg md:text-xl text-muted-foreground leading-relaxed mb-8" style="text-wrap: balance; word-break: keep-all;">为知识库、帮助中心与文档系统设计的下拉选择器</p>
                <a href="#kb-dropdown-showcase" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-md bg-primary text-primary-foreground font-medium hover:opacity-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-opacity">
                    查看组件示例
                    <i data-lucide="arrow-down" class="w-4 h-4"></i>
                </a>
            </div>
        </section>

        <section id="kb-dropdown-showcase" class="w-full max-w-[1200px] mx-auto px-6 pb-24">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                <!-- 默认单选下拉 -->
                <div class="rounded-lg border border-border bg-card p-6 md:p-8 shadow-sm">
                    <h2 class="text-lg font-semibold text-card-foreground mb-2" style="text-wrap: balance; word-break: keep-all;">默认单选下拉</h2>
                    <p class="text-sm text-muted-foreground mb-6" style="word-break: keep-all;">用于从分类列表中选择一个知识库类目，适合导航与筛选场景。</p>
                    <div class="relative flex flex-col sm:flex-row gap-4 min-h-[240px]">
                        <button type="button" class="inline-flex items-center justify-between w-full sm:w-56 px-3.5 py-2 rounded-md border border-border bg-background text-foreground text-sm hover:border-muted-foreground/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                            <span>选择分类</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground"></i>
                        </button>
                        <div class="sm:absolute sm:left-60 sm:top-0 w-full sm:w-56 rounded-md border border-border bg-popover shadow-[var(--shadow-2)] overflow-hidden" style="border-radius: var(--r-md);">
                            <ul class="py-1">
                                <li><button type="button" class="w-full text-left px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">全部</button></li>
                                <li><button type="button" class="w-full text-left px-3 py-2 text-sm text-primary bg-primary/10 font-medium focus-visible:outline-none">产品文档</button></li>
                                <li><button type="button" class="w-full text-left px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">API 文档</button></li>
                                <li><button type="button" class="w-full text-left px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">常见问题</button></li>
                                <li><button type="button" class="w-full text-left px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">最佳实践</button></li>
                                <li><button type="button" class="w-full text-left px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">更新日志</button></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- 带搜索过滤的下拉 -->
                <div class="rounded-lg border border-border bg-card p-6 md:p-8 shadow-sm">
                    <h2 class="text-lg font-semibold text-card-foreground mb-2" style="text-wrap: balance; word-break: keep-all;">带搜索过滤的下拉</h2>
                    <p class="text-sm text-muted-foreground mb-6" style="word-break: keep-all;">在大量文章中快速定位目标内容，输入关键词即时过滤列表。</p>
                    <div class="relative flex flex-col sm:flex-row gap-4 min-h-[240px]">
                        <button type="button" class="inline-flex items-center justify-between w-full sm:w-56 px-3.5 py-2 rounded-md border border-border bg-background text-foreground text-sm hover:border-muted-foreground/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                            <span class="text-muted-foreground">搜索文章...</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground"></i>
                        </button>
                        <div class="sm:absolute sm:left-60 sm:top-0 w-full sm:w-64 rounded-md border border-border bg-popover shadow-[var(--shadow-2)] overflow-hidden" style="border-radius: var(--r-md);">
                            <div class="flex items-center gap-2 px-3 py-2 border-b border-border">
                                <i data-lucide="search" class="w-4 h-4 text-muted-foreground"></i>
                                <input type="text" value="创建" readonly class="w-full bg-transparent text-sm text-foreground placeholder:text-muted-foreground outline-none" />
                            </div>
                            <ul class="py-1">
                                <li><button type="button" class="w-full text-left px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">如何创建知识库</button></li>
                                <li><button type="button" class="w-full text-left px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">权限管理指南</button></li>
                                <li><button type="button" class="w-full text-left px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">导入 Markdown</button></li>
                                <li><button type="button" class="w-full text-left px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">Webhook 配置</button></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- 多选标签下拉 -->
                <div class="rounded-lg border border-border bg-card p-6 md:p-8 shadow-sm">
                    <h2 class="text-lg font-semibold text-card-foreground mb-2" style="text-wrap: balance; word-break: keep-all;">多选标签下拉</h2>
                    <p class="text-sm text-muted-foreground mb-6" style="word-break: keep-all;">支持同时选择多个分类，以标签形式展示在触发器中，便于批量筛选。</p>
                    <div class="relative flex flex-col sm:flex-row gap-4 min-h-[240px]">
                        <button type="button" class="inline-flex items-center justify-between w-full sm:w-56 px-3 py-2 rounded-md border border-border bg-background text-foreground text-sm hover:border-muted-foreground/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-sm bg-primary/10 text-primary text-xs font-medium">产品文档</span>
                                <span class="inline-flex items-center px-2 py-0.5 rounded-sm bg-primary/10 text-primary text-xs font-medium">API 文档</span>
                            </div>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground shrink-0"></i>
                        </button>
                        <div class="sm:absolute sm:left-60 sm:top-0 w-full sm:w-56 rounded-md border border-border bg-popover shadow-[var(--shadow-2)] overflow-hidden" style="border-radius: var(--r-md);">
                            <ul class="py-1">
                                <li>
                                    <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">
                                        <span class="w-4 h-4 rounded flex items-center justify-center border border-primary bg-primary text-primary-foreground"><i data-lucide="check" class="w-3 h-3"></i></span>
                                        产品文档
                                    </button>
                                </li>
                                <li>
                                    <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">
                                        <span class="w-4 h-4 rounded flex items-center justify-center border border-primary bg-primary text-primary-foreground"><i data-lucide="check" class="w-3 h-3"></i></span>
                                        API 文档
                                    </button>
                                </li>
                                <li>
                                    <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">
                                        <span class="w-4 h-4 rounded border border-border"></span>
                                        常见问题
                                    </button>
                                </li>
                                <li>
                                    <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">
                                        <span class="w-4 h-4 rounded border border-border"></span>
                                        最佳实践
                                    </button>
                                </li>
                                <li>
                                    <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none">
                                        <span class="w-4 h-4 rounded border border-border"></span>
                                        更新日志
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- 分组下拉 -->
                <div class="rounded-lg border border-border bg-card p-6 md:p-8 shadow-sm">
                    <h2 class="text-lg font-semibold text-card-foreground mb-2" style="text-wrap: balance; word-break: keep-all;">分组下拉</h2>
                    <p class="text-sm text-muted-foreground mb-6" style="word-break: keep-all;">按团队或内容类型对选项分组，帮助用户在大规模知识库中快速定位。</p>
                    <div class="relative flex flex-col sm:flex-row gap-4 min-h-[240px]">
                        <button type="button" class="inline-flex items-center justify-between w-full sm:w-56 px-3.5 py-2 rounded-md border border-border bg-background text-foreground text-sm hover:border-muted-foreground/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                            <span>按分组浏览</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground"></i>
                        </button>
                        <div class="sm:absolute sm:left-60 sm:top-0 w-full sm:w-56 rounded-md border border-border bg-popover shadow-[var(--shadow-3)] overflow-hidden" style="border-radius: var(--r-md);">
                            <div class="px-3 py-2 text-xs font-semibold text-muted-foreground uppercase tracking-wide">按团队</div>
                            <ul class="pb-1">
                                <li><button type="button" class="w-full text-left flex items-center gap-2 px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none"><i data-lucide="folder-open" class="w-4 h-4 text-muted-foreground"></i>设计</button></li>
                                <li><button type="button" class="w-full text-left flex items-center gap-2 px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none"><i data-lucide="folder-open" class="w-4 h-4 text-muted-foreground"></i>研发</button></li>
                                <li><button type="button" class="w-full text-left flex items-center gap-2 px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none"><i data-lucide="folder-open" class="w-4 h-4 text-muted-foreground"></i>运营</button></li>
                            </ul>
                            <div class="border-t border-border"></div>
                            <div class="px-3 py-2 text-xs font-semibold text-muted-foreground uppercase tracking-wide">按类型</div>
                            <ul class="py-1">
                                <li><button type="button" class="w-full text-left flex items-center gap-2 px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none"><i data-lucide="file-text" class="w-4 h-4 text-muted-foreground"></i>文章</button></li>
                                <li><button type="button" class="w-full text-left flex items-center gap-2 px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none"><i data-lucide="video" class="w-4 h-4 text-muted-foreground"></i>视频</button></li>
                                <li><button type="button" class="w-full text-left flex items-center gap-2 px-3 py-2 text-sm text-foreground hover:bg-muted focus-visible:bg-muted focus-visible:outline-none"><i data-lucide="layout-template" class="w-4 h-4 text-muted-foreground"></i>模板</button></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
