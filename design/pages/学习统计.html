    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

@theme inline {
  --color-cl-background: #F7F8FA;
  --color-cl-foreground: #1A1D23;
  --color-cl-card: #FFFFFF;
  --color-cl-card-foreground: #1A1D23;
  --color-cl-popover: #FFFFFF;
  --color-cl-popover-foreground: #1A1D23;

  --color-cl-ring: #3B6FE0;
  --color-cl-sidebar: #F0F2F5;
  --color-cl-sidebar-foreground: #374151;

  --color-cl-state-success-foreground: #FFFFFF;
  --color-cl-state-error: #EF4444;
  --color-cl-state-error-foreground: #FFFFFF;
  --color-cl-state-warning: #F59E0B;
  --color-cl-state-warning-foreground: #FFFFFF;
  --color-cl-radius-sm: 8px;
  --color-cl-radius-md: 12px;
  --color-cl-radius-lg: 16px;
}

:root {
  --cl-background: #F7F8FA;
  --cl-foreground: #1A1D23;
  --cl-card: #FFFFFF;
  --cl-card-foreground: #1A1D23;
  --cl-popover: #FFFFFF;
  --cl-popover-foreground: #1A1D23;
  --cl-primary: #3B6FE0;
  --cl-primary-foreground: #FFFFFF;
  --cl-muted: #E8ECF1;
  --cl-muted-foreground: #6B7280;
  --cl-border: #E2E6EC;
  --cl-input: #E2E6EC;
  --cl-ring: #3B6FE0;
  --cl-sidebar: #F0F2F5;
  --cl-sidebar-foreground: #374151;
  --cl-state-success: #10B981;
  --cl-state-success-foreground: #FFFFFF;
  --cl-state-error: #EF4444;
  --cl-state-error-foreground: #FFFFFF;
  --cl-state-warning: #F59E0B;
  --cl-state-warning-foreground: #FFFFFF;
  --cl-radius-sm: 8px;
  --cl-radius-md: 12px;
  --cl-radius-lg: 16px;
  --font-sans: 'Noto Sans SC', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
}

#semantic-token-fallback {
  --background: var(--cl-background);
  --foreground: var(--cl-foreground);
  --card: var(--cl-card);
  --card-foreground: var(--cl-card-foreground);
  --popover: var(--cl-popover);
  --popover-foreground: var(--cl-popover-foreground);
  --primary: var(--cl-primary);
  --primary-foreground: var(--cl-primary-foreground);
  --muted: var(--cl-muted);
  --muted-foreground: var(--cl-muted-foreground);
  --border: var(--cl-border);
  --input: var(--cl-input);
  --ring: var(--cl-ring);
  --radius-sm: var(--cl-radius-sm);
  --radius-md: var(--cl-radius-md);
  --radius-lg: var(--cl-radius-lg);
}

/* Typography scale */
.cl-h1 {
  font-family: var(--font-sans);
  font-size: 24px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--cl-foreground);
}

.cl-h2 {
  font-family: var(--font-sans);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--cl-foreground);
}

.cl-h3 {
  font-family: var(--font-sans);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--cl-foreground);
}

.cl-body {
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--cl-card-foreground);
}

.cl-body-sm {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--cl-muted-foreground);
}

.cl-caption {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--cl-muted-foreground);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* Mini program safe area simulation */
.mp-safe-bottom {
  padding-bottom: env(safe-area-inset-bottom, 20px);
}

.mp-status-bar {
  height: 44px;
}

    </style>

    <style type="text/tailwindcss">

<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen pb-8">
      <!-- Status bar spacer -->
      <div class="h-11"></div>

      <!-- Mini program nav bar -->
      <header class="sticky top-0 z-30 border-b" style="border-color: var(--cl-border); background: rgba(247, 248, 250, 0.95); backdrop-filter: blur(12px);">
        <div class="flex h-11 items-center px-4">
          <div class="flex w-[88px] items-center justify-start">
            <button class="inline-flex h-8 w-8 items-center justify-center rounded-lg" style="border: 1px solid var(--cl-border); background: var(--cl-background);" aria-label="返回">
              <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--cl-foreground);"></i>
            </button>
          </div>
          <div class="min-w-0 flex-1 text-center text-[16px] font-semibold" style="color: var(--cl-foreground); letter-spacing: -0.02em;">学习统计</div>
          <div class="flex h-8 w-[88px] items-center justify-center" style="border-radius: 9999px; border: 1px solid var(--cl-border); background: rgba(247, 248, 250, 0.9); color: var(--cl-foreground);" aria-label="小程序菜单">
            <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" class="h-4 w-4"></i>
            </button>
            <span class="h-4 w-px" style="background: var(--cl-border);" aria-hidden="true"></span>
            <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Period selector tabs -->
      <div class="flex gap-2 px-4 pt-4 pb-2">
        <button class="px-4 py-1.5 text-sm font-medium whitespace-nowrap" style="background: var(--cl-primary); color: var(--cl-primary-foreground); border-radius: var(--cl-radius-sm);">本周</button>
        <button class="px-4 py-1.5 text-sm font-medium whitespace-nowrap" style="background: var(--cl-muted); color: var(--cl-muted-foreground); border-radius: var(--cl-radius-sm);">本月</button>
        <button class="px-4 py-1.5 text-sm font-medium whitespace-nowrap" style="background: var(--cl-muted); color: var(--cl-muted-foreground); border-radius: var(--cl-radius-sm);">全部</button>
      </div>

      <!-- Summary stats 2x2 grid -->
      <section class="grid grid-cols-2 gap-3 px-4 pt-2 pb-4">
        <div class="rounded-lg p-3" style="background: var(--cl-card);">
          <div class="flex items-center gap-1 mb-1">
            <i data-lucide="clock" class="h-3.5 w-3.5" style="color: var(--cl-primary);"></i>
            <span class="text-xs" style="color: var(--cl-muted-foreground);">学习时长</span>
          </div>
          <div class="flex items-baseline gap-1.5">
            <span class="text-xl font-bold whitespace-nowrap" style="color: var(--cl-foreground);">12.5</span>
            <span class="text-xs whitespace-nowrap" style="color: var(--cl-muted-foreground);">小时</span>
            <i data-lucide="trending-up" class="h-3.5 w-3.5 ml-auto" style="color: var(--cl-state-success);"></i>
          </div>
        </div>
        <div class="rounded-lg p-3" style="background: var(--cl-card);">
          <div class="flex items-center gap-1 mb-1">
            <i data-lucide="book-open" class="h-3.5 w-3.5" style="color: var(--cl-primary);"></i>
            <span class="text-xs" style="color: var(--cl-muted-foreground);">完成课程</span>
          </div>
          <div class="flex items-baseline gap-1">
            <span class="text-xl font-bold whitespace-nowrap" style="color: var(--cl-foreground);">8</span>
            <span class="text-xs whitespace-nowrap" style="color: var(--cl-muted-foreground);">个</span>
          </div>
        </div>
        <div class="rounded-lg p-3" style="background: var(--cl-card);">
          <div class="flex items-center gap-1 mb-1">
            <i data-lucide="layers" class="h-3.5 w-3.5" style="color: var(--cl-primary);"></i>
            <span class="text-xs" style="color: var(--cl-muted-foreground);">闪卡复习</span>
          </div>
          <div class="flex items-baseline gap-1">
            <span class="text-xl font-bold whitespace-nowrap" style="color: var(--cl-foreground);">45</span>
            <span class="text-xs whitespace-nowrap" style="color: var(--cl-muted-foreground);">张</span>
          </div>
        </div>
        <div class="rounded-lg p-3" style="background: var(--cl-card);">
          <div class="flex items-center gap-1 mb-1">
            <i data-lucide="target" class="h-3.5 w-3.5" style="color: var(--cl-primary);"></i>
            <span class="text-xs" style="color: var(--cl-muted-foreground);">正确率</span>
          </div>
          <div class="flex items-baseline gap-1">
            <span class="text-xl font-bold whitespace-nowrap" style="color: var(--cl-foreground);">78</span>
            <span class="text-xs whitespace-nowrap" style="color: var(--cl-muted-foreground);">%</span>
          </div>
        </div>
      </section>

      <!-- Weekly heatmap card -->
      <section class="mx-4 mb-4 rounded-lg p-4" style="background: var(--cl-card);">
        <h3 class="text-[15px] font-semibold mb-3" style="color: var(--cl-foreground);">学习热力图</h3>
        <div class="grid grid-cols-7 gap-1.5 mb-3">
          <span class="text-[10px] text-center" style="color: var(--cl-muted-foreground);">一</span>
          <span class="text-[10px] text-center" style="color: var(--cl-muted-foreground);">二</span>
          <span class="text-[10px] text-center" style="color: var(--cl-muted-foreground);">三</span>
          <span class="text-[10px] text-center" style="color: var(--cl-muted-foreground);">四</span>
          <span class="text-[10px] text-center" style="color: var(--cl-muted-foreground);">五</span>
          <span class="text-[10px] text-center" style="color: var(--cl-muted-foreground);">六</span>
          <span class="text-[10px] text-center" style="color: var(--cl-muted-foreground);">日</span>
          <!-- Week 1 -->
          <div class="aspect-square rounded-sm heat-0"></div>
          <div class="aspect-square rounded-sm heat-1"></div>
          <div class="aspect-square rounded-sm heat-2"></div>
          <div class="aspect-square rounded-sm heat-1"></div>
          <div class="aspect-square rounded-sm heat-3"></div>
          <div class="aspect-square rounded-sm heat-0"></div>
          <div class="aspect-square rounded-sm heat-0"></div>
          <!-- Week 2 -->
          <div class="aspect-square rounded-sm heat-1"></div>
          <div class="aspect-square rounded-sm heat-2"></div>
          <div class="aspect-square rounded-sm heat-3"></div>
          <div class="aspect-square rounded-sm heat-2"></div>
          <div class="aspect-square rounded-sm heat-1"></div>
          <div class="aspect-square rounded-sm heat-1"></div>
          <div class="aspect-square rounded-sm heat-0"></div>
          <!-- Week 3 -->
          <div class="aspect-square rounded-sm heat-0"></div>
          <div class="aspect-square rounded-sm heat-2"></div>
          <div class="aspect-square rounded-sm heat-1"></div>
          <div class="aspect-square rounded-sm heat-0"></div>
          <div class="aspect-square rounded-sm heat-2"></div>
          <div class="aspect-square rounded-sm heat-3"></div>
          <div class="aspect-square rounded-sm heat-1"></div>
          <!-- Week 4 -->
          <div class="aspect-square rounded-sm heat-1"></div>
          <div class="aspect-square rounded-sm heat-3"></div>
          <div class="aspect-square rounded-sm heat-2"></div>
          <div class="aspect-square rounded-sm heat-3"></div>
          <div class="aspect-square rounded-sm heat-1"></div>
          <div class="aspect-square rounded-sm heat-0"></div>
          <div class="aspect-square rounded-sm heat-0"></div>
          <!-- Week 5 -->
          <div class="aspect-square rounded-sm heat-0"></div>
          <div class="aspect-square rounded-sm heat-1"></div>
          <div class="aspect-square rounded-sm heat-1"></div>
          <div class="aspect-square rounded-sm heat-2"></div>
          <div class="aspect-square rounded-sm heat-0"></div>
          <div class="aspect-square rounded-sm heat-0"></div>
          <div class="aspect-square rounded-sm heat-0"></div>
        </div>
        <div class="flex items-center justify-end gap-1.5">
          <span class="text-[10px]" style="color: var(--cl-muted-foreground);">少</span>
          <div class="h-2.5 w-2.5 rounded-sm heat-0"></div>
          <div class="h-2.5 w-2.5 rounded-sm heat-1"></div>
          <div class="h-2.5 w-2.5 rounded-sm heat-2"></div>
          <div class="h-2.5 w-2.5 rounded-sm heat-3"></div>
          <span class="text-[10px]" style="color: var(--cl-muted-foreground);">多</span>
        </div>
      </section>

      <!-- Subject breakdown card -->
      <section class="mx-4 mb-4 rounded-lg p-4" style="background: var(--cl-card);">
        <h3 class="text-[15px] font-semibold mb-3" style="color: var(--cl-foreground);">各语言学习时长</h3>
        <div class="mb-3">
          <div class="flex justify-between items-center mb-1">
            <span class="text-sm" style="color: var(--cl-card-foreground);">Java</span>
            <span class="text-xs font-medium" style="color: var(--cl-muted-foreground);">5.2h</span>
          </div>
          <div class="h-2 rounded-full" style="background: var(--cl-muted);">
            <div class="h-2 rounded-full" style="width: 100%; background: var(--cl-primary);"></div>
          </div>
        </div>
        <div class="mb-3">
          <div class="flex justify-between items-center mb-1">
            <span class="text-sm" style="color: var(--cl-card-foreground);">Python</span>
            <span class="text-xs font-medium" style="color: var(--cl-muted-foreground);">3.8h</span>
          </div>
          <div class="h-2 rounded-full" style="background: var(--cl-muted);">
            <div class="h-2 rounded-full" style="width: 73%; background: var(--cl-primary);"></div>
          </div>
        </div>
        <div class="mb-3">
          <div class="flex justify-between items-center mb-1">
            <span class="text-sm" style="color: var(--cl-card-foreground);">前端</span>
            <span class="text-xs font-medium" style="color: var(--cl-muted-foreground);">2.1h</span>
          </div>
          <div class="h-2 rounded-full" style="background: var(--cl-muted);">
            <div class="h-2 rounded-full" style="width: 40%; background: var(--cl-primary);"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-sm" style="color: var(--cl-card-foreground);">算法</span>
            <span class="text-xs font-medium" style="color: var(--cl-muted-foreground);">1.4h</span>
          </div>
          <div class="h-2 rounded-full" style="background: var(--cl-muted);">
            <div class="h-2 rounded-full" style="width: 27%; background: var(--cl-primary);"></div>
          </div>
        </div>
      </section>

      <!-- Recent learning log -->
      <section class="mx-4 mb-4">
        <h3 class="text-[15px] font-semibold mb-3" style="color: var(--cl-foreground);">最近学习</h3>
        <div class="flex items-center gap-3 py-3" style="border-bottom: 1px solid var(--cl-border);">
          <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" style="background: color-mix(in srgb, var(--cl-primary) 12%, var(--cl-card));">
            <i data-lucide="check-circle" class="h-4 w-4" style="color: var(--cl-primary);"></i>
          </div>
          <p class="min-w-0 flex-1 text-sm truncate" style="color: var(--cl-card-foreground);">完成了 Java HashMap 章节</p>
          <span class="text-xs shrink-0 whitespace-nowrap" style="color: var(--cl-muted-foreground);">2小时前</span>
        </div>
